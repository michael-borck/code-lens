[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-analyser"
version = "1.1.0"
description = "Source code analyser — part of the analyser family"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "html5lib>=1.1",
    "tinycss2>=1.2.0",
    "esprima>=4.0.0",
    "sqlparse>=0.4.4",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.7.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
code-analyser = "code_analyser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "tests"]
addopts = "--cov=src/code_analyser --cov-report=term-missing --strict-markers -m 'not slow'"
markers = [
    "slow: tests that invoke external tools (ruff, html5lib parse, w3c) — opt-in with `pytest -m slow`",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
